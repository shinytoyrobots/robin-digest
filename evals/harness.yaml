schema-version: "1.0"
suite-version: "0.4.0"

# This effort overrides the default 6 dimensions. See spec/constitution.md
# "Dimension defaults" section for rationale.

dimensions:
  - name: source-diversity
    graders: [source-diversity]
    datasets:
      - source-diversity-real-v1
      - source-diversity-adv-v1
    threshold: 0.95          # real-dataset threshold
    threshold-adversarial: 0.50  # current adv-v1 mean; "no regression below today" floor
    grader-type: deterministic
    runner: evals/runners/source-diversity.ts
    description: >-
      Verifies each regular suggestion (category != "engage") in a direction
      cites a pairwise-distinct set of external URLs/hosts. See SR-001.

  - name: internal-external-bridging
    graders: [internal-external-bridging]
    datasets:
      - internal-external-bridging-real-v1
      - internal-external-bridging-adv-v1
    threshold: 0.90          # real-dataset threshold
    threshold-adversarial: 0.60  # current adv-v1 mean; no-regression floor
    grader-type: hybrid  # deterministic structural check; LLM-judge mode deferred
    runner: evals/runners/internal-external-bridging.ts
    description: >-
      Verifies each regular suggestion contains both an internal anchor (no URL)
      and an external anchor (URL). Adversarial LLM-judge mode (SR-003) not yet
      implemented in v0.2.0; tracked in spec/spec.md "Open ambiguities".

  # ── v0.4.0 engage-trust-compliance — ACTIVE (deterministic) ─────────
  # Synthetic seed datasets (committed; no production content). Carries zero
  # AGGREGATE weight for now (rebalance deferred until the LLM-judge engage
  # dims also come online — a deliberate HITL /flow-spec decision); it still
  # scores and flags regressions on its own thresholds. constitution.md
  # "active dimensions" list (weighted) stays accurate.
  - name: engage-trust-compliance
    graders: [engage-trust-compliance]
    datasets:
      - engage-trust-compliance-real-v1
      - engage-trust-compliance-adv-v1
    threshold: 1.0               # compliance-rate on real (hard invariant)
    threshold-adversarial: 1.0   # detection-rate on adv (must catch all seeded violations)
    grader-type: deterministic
    runner: evals/runners/engage-trust-compliance.ts
    weight-pending: true         # active + scoring; aggregate weight rebalanced later
    description: >-
      Deterministic structural checks on engage drafts (category == "engage").
      Covers SR-005 (no Robin-owned URL, no ask/CTA, no credential-preface),
      SR-009 (channel matches source commentability), and the structural part
      of SR-010 (one non-empty draft per engage item; <=1 engage item per track).

  # ── v0.3.0 engage dimensions — DECLARED but PENDING (LLM-judge) ─────
  # draft/channel exist in production now, but these need enough drafts to
  # calibrate the judge + build a holdout. Datasets pending; zero live weight.
  - name: engage-substance
    graders: [engage-substance]
    datasets: []
    threshold: null
    threshold-adversarial: null
    grader-type: llm-judge
    runner: null
    mapping-pending: true
    status: pending-implementation
    weight-pending: true
    description: >-
      LLM-judge of engage-draft substance. Covers SR-004 (specific anchor to a
      named detail; generic praise is a violation) and SR-007 (carries a delta,
      extends the thread; rejects sycophancy and eristic point-scoring). Also
      receives the LLM-judge "Letters-Page bar" component of SR-010.

  - name: engage-open-hand
    graders: [engage-open-hand]
    datasets: []
    threshold: null
    threshold-adversarial: null
    grader-type: hybrid
    runner: null
    mapping-pending: true
    status: pending-implementation
    weight-pending: true
    description: >-
      Hybrid grader for SR-006: deterministic terminal-question / explicit
      unresolved-tension signal as a fast positive, LLM-judge adjudicating
      "opens vs. closes" where the terminal signal is absent or ambiguous.

  - name: voice-authenticity
    graders: [voice-authenticity]
    datasets: []
    threshold: null
    threshold-adversarial: null
    grader-type: llm-judge
    runner: null
    mapping-pending: true
    status: pending-implementation
    weight-pending: true
    description: >-
      LLM-judge for SR-008 voice clause: the draft reads as a ready-to-edit
      scaffold in Robin's voice, not corporate/AI boilerplate. The SR-008
      automation-ceiling clause is a PROCESS INVARIANT (no auto-post code path)
      verified as a system property, not by scoring direction rows.

weights:
  source-diversity: 0.50
  internal-external-bridging: 0.50

# engage-trust-compliance is ACTIVE (scoring) but unweighted for now; the
# three LLM-judge dims are still pending datasets. All engage dims carry zero
# aggregate weight until a deliberate rebalance (HITL /flow-spec, per
# constitution: weight change after grading → preference-articulator).
weights-pending:
  engage-trust-compliance: 0.0   # active grader; aggregate weight rebalance pending
  engage-substance: 0.0
  engage-open-hand: 0.0
  voice-authenticity: 0.0

mappings:
  SR-001:
    grader: source-diversity
    datasets: [source-diversity-real-v1, source-diversity-adv-v1]
    threshold: 0.95
  SR-002:
    grader: internal-external-bridging
    datasets: [internal-external-bridging-real-v1]
    threshold: 0.90
  SR-003:
    grader: internal-external-bridging
    grader-mode: adversarial
    datasets: [internal-external-bridging-adv-v1]
    threshold: 0.80
  # ── v0.3.0 engage SRs — mapping-pending (graders/datasets pending v1) ──
  SR-004:
    grader: engage-substance
    datasets: []
    threshold: null
    mapping-pending: true
    status: pending-implementation
    note: Specific anchor to a named detail; generic praise is a violation. LLM-judge.
  SR-005:
    grader: engage-trust-compliance
    datasets: [engage-trust-compliance-real-v1, engage-trust-compliance-adv-v1]
    threshold: 1.0
    status: active
    note: Deterministic — no Robin-owned URL/self-link, no ask/CTA, no credential-preface. OA-3 resolved (robin-cannon.com + .dev).
  SR-006:
    grader: engage-open-hand
    datasets: []
    threshold: null
    mapping-pending: true
    status: pending-implementation
    note: Hybrid — deterministic terminal-question signal + LLM-judge opens-vs-closes.
  SR-007:
    grader: engage-substance
    datasets: []
    threshold: null
    mapping-pending: true
    status: pending-implementation
    note: LLM-judge — carries a delta and extends the thread; non-sycophantic, non-eristic.
  SR-008:
    grader: voice-authenticity
    datasets: []
    threshold: null
    mapping-pending: true
    status: pending-implementation
    note: LLM-judge for voice. Automation ceiling is a process invariant (no auto-post path), not row-scored.
  SR-009:
    grader: engage-trust-compliance
    datasets: [engage-trust-compliance-real-v1, engage-trust-compliance-adv-v1]
    threshold: 1.0
    status: active
    note: Deterministic — [COMMENTABLE]=>comments; [NO COMMENTS]=>{linkedin,x,response-post}. OA-4 resolved (commentability re-derived from source_url).
  SR-010:
    grader: engage-trust-compliance
    grader-secondary: engage-substance
    datasets: [engage-trust-compliance-real-v1, engage-trust-compliance-adv-v1]
    threshold: 1.0
    status: partially-active
    note: Structural part ACTIVE (one draft/item, <=1 engage/track). LLM-judge "bar" component (engage-substance) deferred — needs gatherer-context persistence; see spec OA-5.

goodhart-mitigation:
  adversarial-required-for: [source-diversity, internal-external-bridging, engage-trust-compliance]
  rotation-period-days: 90
  score-climb-flag-threshold: 0.30
  real-dataset-floor-pct: 50  # adversarial datasets must be ≥50% real failure modes (constitution rule 3)
  # NOTE: engage-trust-compliance-adv-v1 is currently 100% SYNTHETIC — the
  # feature has no production failure history yet. Backfill to >=50% real
  # production misfires (target -v2) once observed. Tracked below.

metastable:
  # Metastable detection is not meaningful for this measurement-only effort.
  # Retained for schema compatibility but never satisfied.
  stability-threshold: 1.0
  spec-proximity-threshold: 1.0
  pareto-dimension-minimum: 2

artifact-shape:
  # What the eval suite scores: a row from daily_directions.suggestions (JSON-parsed)
  type: direction-row
  schema-ref: src/direction/generator.ts:Suggestion
  source-table: daily_directions
  source-column: suggestions

deferred-dimensions:
  # Listed for visibility; not active in v0.1.0
  - name: track-purity
    rationale: Defer until source-diversity + bridging baselines are stable
  - name: lens-coherence
    rationale: LLM-judge intensive; defer until prompt is stable

notes:
  default-dimensions-disabled: [correctness, performance, maintainability, accessibility, security, cost]
  default-dimensions-disabled-rationale: >-
    Artifact under evaluation is LLM-generated text content, not executable code.
    Default dimensions are not applicable. See constitution.md.

  adversarial-snapshot-limitation: >-
    The v0.2.0 adversarial datasets are output snapshots of historical
    production failures, not re-runnable input probes. They cannot be
    "improved" by prompt iteration because the inputs (gathered context)
    that produced them are not persisted. The thresholds are set to current
    adv-mean as no-regression floors. v0.3.0 should persist gatherer context
    per direction so adversarials become re-runnable probes that exercise
    the current prompt against historically-difficult inputs.

  engage-dimensions-pending: >-
    engage-trust-compliance, engage-substance, engage-open-hand and
    voice-authenticity are declared in spec v0.3.0 (SR-004..010) but pending
    implementation: the draft/channel fields do not exist on historical
    daily_directions rows. Real datasets populate only after the v1 prompt+code
    change ships and production emits draft/channel data. Until then these
    dimensions carry zero live weight and do not affect the source-diversity /
    internal-external-bridging scores or weights.

  engage-adversarial-backfill-obligation: >-
    Per constitution Prohibition 3, adversarial datasets for the engage
    dimensions start synthetic and MUST be backfilled to >=50% real production
    failure modes once v1 drafts exist in production. When the engage dimensions
    leave pending status, add them to goodhart-mitigation.adversarial-required-for.

